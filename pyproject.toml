[project]
name = "scholar-pdf-patcher"
version = "0.5.3.6"
description = "Automated patching utility to port Google Scholar PDF Reader Chrome extension to Firefox-based browsers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Yousef Rashad" }
]
keywords = ["firefox", "extension", "port", "google-scholar", "pdf-reader"]
dependencies = [
    "jsbeautifier>=1.15.1",
]

[project.scripts]
scholar-pdf-patcher = "patch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "patch.py",
    "reader_firefox_helper.js",
]

